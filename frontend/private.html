<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VAULT v3.3 AUTO</title>
<style>body{background:#0a0e1a;color:#c0c0c0;font-family:monospace;padding:20px}
#drop{border:2px dashed #00ff88;padding:40px;text-align:center;cursor:pointer;margin:20px 0;border-radius:10px}
#drop:hover{border-color:cyan;background:#0f1f2f}
.badge{color:cyan} #log{height:200px;overflow:auto;border:1px solid #333;padding:10px}</style>
</head><body>
<h2>VAULT v3.3 AUTO - <span id="watchStatus">WATCH: ON</span></h2>
<div>Legal:<span id="legalC">0</span> | Learnings:<span id="learnC">0</span> | All:<span id="allC">0</span>
<button onclick="exportVault()">EXPORT</button>
<button id="watchBtn" onclick="toggleWatch()">WATCH CLIPBOARD: ON</button></div>

<div id="drop" onclick="document.getElementById('fileInput').click()">
CLICK HERE or DROP 50 LEGAL DOCS HERE<br><small>Your desktop files will open - select PDFs</small>
<input type="file" id="fileInput" multiple accept=".pdf,.txt,.docx" style="display:none" onchange="handleFiles(this.files)">
</div>

<div style="display:flex;gap:20px">
<div style="flex:1"><h3>Folders</h3><div id="folders"></div></div>
<div style="flex:2"><h3>Content</h3><div id="content"></div></div>
<div style="flex:1"><h3>Legal Brain</h3>
<input id="find" placeholder="Quick find: NRS, Trustee..." oninput="doFind(this.value)" style="width:100%">
<div id="log">Watching & Learning...</div></div>
</div>

<script>
let docs=[]; let watchOn=true;
function toggleWatch(){watchOn=!watchOn; document.getElementById('watchStatus').innerText=watchOn?'WATCH: ON':'WATCH: OFF';
document.getElementById('watchBtn').innerText=watchOn?'WATCH CLIPBOARD: ON':'WATCH CLIPBOARD: OFF';
document.getElementById('watchBtn').style.color=watchOn?'cyan':'red';}

const drop=document.getElementById('drop');
drop.addEventListener('dragover',e=>{e.preventDefault(); drop.style.borderColor='cyan';});
drop.addEventListener('dragleave',e=>{drop.style.borderColor='#00ff88';});
drop.addEventListener('drop',e=>{e.preventDefault(); handleFiles(e.dataTransfer.files);});

function handleFiles(files){
for(let f of files){
let reader=new FileReader();
reader.onload=e=>{
let text=e.target.result.substring(0,50000);
let entry={id:Date.now()+Math.random(), name:f.name, text:text, time:new Date().toLocaleTimeString(), tags:extractTags(text), type:f.name.endsWith('.pdf')?'Legal':'Learning'};
docs.push(entry); render();
log(`Loaded: ${f.name}`);
};
if(f.name.endsWith('.txt')) reader.readAsText(f); else reader.readAsArrayBuffer(f) && reader.readAsText(f);
}
}
function extractTags(t){let m=t.match(/NRS\s*\d+\.\d+/gi); return m?[...new Set(m)]:[];}

document.addEventListener('paste',e=>{
if(!watchOn) return;
let text=(e.clipboardData||window.clipboardData).getData('text');
if(text && text.length>30){
let entry={id:Date.now(), name:`AutoLearn ${new Date().toLocaleTimeString()}`, text:text, time:new Date().toLocaleTimeString(), tags:extractTags(text), type:'Learning'};
docs.push(entry); render(); log(`Auto-Learned: ${text.substring(0,60)}...`);
}
});

function render(){
document.getElementById('legalC').innerText=docs.filter(d=>d.type!=='Learning').length;
document.getElementById('learnC').innerText=docs.filter(d=>d.type==='Learning').length;
document.getElementById('allC').innerText=docs.length;
let fDiv=document.getElementById('folders'); fDiv.innerHTML='';
let groups={}; docs.forEach(d=>{let k=d.type; if(!groups[k]) groups[k]=[]; groups[k].push(d);});
for(let k in groups){fDiv.innerHTML+=`<div onclick="showGroup('${k}')"><span class="badge">${k}</span> ${groups[k].length}</div>`;}
if(docs.length) showGroup(Object.keys(groups)[0]);
}
function showGroup(k){
let c=document.getElementById('content'); c.innerHTML='';
docs.filter(d=>d.type===k).forEach(d=>{
c.innerHTML+=`<div style="border:1px solid #333;margin:5px;padding:8px"><b>${d.name}</b> <span class="badge">${d.tags.join(', ')}</span><br><small>${d.text.substring(0,300)}</small></div>`;
});
}
function doFind(q){if(!q) return render(); let c=document.getElementById('content'); c.innerHTML='';
docs.filter(d=>d.text.toLowerCase().includes(q.toLowerCase())).forEach(d=>{
c.innerHTML+=`<div style="border:1px solid cyan;margin:5px;padding:8px"><b>${d.name}</b><br>${d.text.substring(0,400)}</div>`;
});
}
function log(m){let l=document.getElementById('log'); l.innerHTML=`${new Date().toLocaleTimeString()} ${m}<br>`+l.innerHTML;}
function exportVault(){let blob=new Blob([JSON.stringify(docs)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vault-export.json'; a.click();}
render();
</script></body></html>
